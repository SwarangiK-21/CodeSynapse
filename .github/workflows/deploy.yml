name: Deploy

# Publishes main to the Hugging Face Space once CI has passed on it
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  space:
    if: >-
      vars.HF_SPACE != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    concurrency: deploy-space
    permissions:
      contents: read
      # Lets the job prove to Hugging Face that it is this repo's deploy.yml on main.
      # The Space's trusted publisher accepts exactly that, so no HF token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install huggingface_hub==2.3.0
      - run: python deploy/push_space.py
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
