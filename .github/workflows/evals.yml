name: Evals

# Runs the AI evaluations that need Gemini. Started by hand from the Actions tab, because it
# uses the free daily quota. Results are committed back to the branch it ran on, and a run
# stopped by the quota resumes where it left off when started again.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [calibration, reranker, agent-rerun]
        default: calibration

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency: evals-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # The search index takes a while and quota to build, so it is kept between runs
      - uses: actions/cache/restore@v4
        with:
          path: evals/.cache
          key: eval-index-${{ hashFiles('evals/cases.json', 'evals/cases_hard.json') }}-${{ github.run_id }}
          restore-keys: eval-index-${{ hashFiles('evals/cases.json', 'evals/cases_hard.json') }}-
      # Without a cached index, start from the published one instead of embedding every
      # repository again, which would take days of the free embedding quota
      - name: Fetch the published evaluation index
        run: |
          if [ -f evals/.cache/eval.db ]; then echo "Using the cached index"; exit 0; fi
          mkdir -p evals/.cache
          curl -sSfL -o "$RUNNER_TEMP/eval.db.xz" \
            "https://github.com/${{ github.repository }}/releases/download/eval-index-v1/eval.db.xz"
          xz -d -c "$RUNNER_TEMP/eval.db.xz" > evals/.cache/eval.db
          echo "4b9da900e02eb95c68ad93eecdad9af6f534435bcdd04cc71530fe30e4ecc274  evals/.cache/eval.db" | sha256sum -c -
      - name: Collect calibration records
        if: inputs.command == 'calibration'
        run: python -m evals.calibration collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Score reranker candidates with the teacher model
        if: inputs.command == 'reranker'
        run: python -m evals.reranker label
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the reranker's training tools
        if: inputs.command == 'reranker'
        run: pip install -r requirements-reranker.txt
      - name: Train and evaluate the reranker
        if: inputs.command == 'reranker'
        run: python -m evals.reranker train
      # Each system resumes where it stopped, so a quota stop in one doesn't lose the others
      - name: Re-run the agent and baseline on the current sets
        if: inputs.command == 'agent-rerun'
        run: |
          status=0
          for system in agent-equal agent-tuned agent-hard-equal agent-hard-tuned baseline-equal baseline-hard-equal; do
            python -m evals.run "$system" || status=1
          done
          python -m evals.run report > /dev/null || status=1
          exit $status
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: inputs.command == 'reranker'
        with:
          name: reranker-model
          path: evals/.cache/reranker-model
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: evals/.cache
          key: eval-index-${{ hashFiles('evals/cases.json', 'evals/cases_hard.json') }}-${{ github.run_id }}
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add rejects the whole list if one file is missing, so add only those that exist
          for f in evals/results/calibration.jsonl evals/results/reranker_labels.jsonl evals/results/reranker.json                    evals/results/*-equal.jsonl evals/results/*-tuned.jsonl evals/results/summary.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Add ${{ inputs.command }} results from the Evals workflow"
          git push
