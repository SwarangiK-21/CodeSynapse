name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codesynapse
          POSTGRES_PASSWORD: codesynapse
          POSTGRES_DB: codesynapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesynapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codesynapse:codesynapse@localhost:5432/codesynapse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
